name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: python -m compileall -q src tests ctfkit.py
      - run: python -m build
      - name: Validate distributions
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == len(sdists) == 1
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert archive.testzip() is None
              assert "ctfkit/cli.py" in names
              assert "ctfkit/py.typed" in names
          with tarfile.open(sdists[0]) as archive:
              names = archive.getnames()
              assert any(name.endswith("/ctfkit.py") for name in names)
              assert any(name.endswith("/tests/conftest.py") for name in names)
          PY
      - run: ctfkit --version
